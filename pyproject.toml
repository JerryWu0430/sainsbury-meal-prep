[project]
name = "sainsbury-meal-prep"
version = "0.1.0"
description = "CLI: browse Sainsbury's (Elephant & Castle) offers, new-in items & meal-prep ideas"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.7",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.43.0",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
]

[project.scripts]
sains = "sains.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sains"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
